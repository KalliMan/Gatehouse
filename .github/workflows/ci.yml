name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Gatehouse.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build Gatehouse.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Gatehouse.slnx --configuration Release --no-build
