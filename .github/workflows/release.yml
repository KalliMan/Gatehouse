name: Release

on:
  push:
    tags: ['captcha-v*', 'accounts-v*']

permissions:
  contents: read
  id-token: write   # nuget.org trusted publishing

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Package and version from the tag
        run: |
          case "$GITHUB_REF_NAME" in
            captcha-v*)  echo "PROJECT=src/Gatehouse.Captcha" >> "$GITHUB_ENV" ;;
            accounts-v*) echo "PROJECT=src/Gatehouse.Accounts" >> "$GITHUB_ENV" ;;
            *) echo "Unknown tag $GITHUB_REF_NAME"; exit 1 ;;
          esac
          echo "VERSION=${GITHUB_REF_NAME#*-v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test Gatehouse.slnx --configuration Release -p:Version=$VERSION

      - name: Pack
        run: dotnet pack "$PROJECT" --configuration Release --no-build -p:Version=$VERSION --output artifacts

      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
